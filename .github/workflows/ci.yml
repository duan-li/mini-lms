name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Only the services the app and tests use: Postgres, Auth, PostgREST, Kong, Mailpit, pg-meta.
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,storage-api,edge-runtime,logflare,vector,realtime,supavisor

      - name: Reset database (migrations + seed)
        run: npx supabase db reset

      # The committed types must match the migrations.
      - name: Check generated database types
        run: |
          npx supabase gen types typescript > "$RUNNER_TEMP/database.types.ts"
          if ! diff -u lib/database.types.ts "$RUNNER_TEMP/database.types.ts"; then
            echo "::error file=lib/database.types.ts::Out of date. Run \`npm run db:types\` and commit the result."
            exit 1
          fi

      # Local Supabase keys are fixed, public development values.
      - name: Export Supabase environment
        run: |
          npx supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.publishable_key=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            | grep '^NEXT_PUBLIC_' | sed 's/"//g' >> "$GITHUB_ENV"

      # Integration tests read the secret key from `supabase status` themselves,
      # so it never enters the shared job environment. Every project runs, and
      # the run fails below 90% line or branch coverage of lib/services and
      # lib/validation (thresholds in vitest.config.mts).
      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      # Browser tests against their own production build on port 3200.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
